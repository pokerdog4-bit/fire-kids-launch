<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Ellie's Apps</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(760px, 100%);
      display: grid;
      gap: 22px;
    }
    h1 {
      margin: 0 0 4px;
      text-align: center;
      font-size: clamp(30px, 6vw, 48px);
    }
    p {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 1.4;
    }
    .apps {
      display: grid;
      gap: 18px;
      margin-top: 8px;
    }
    .app-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 112px;
      padding: 22px;
      border-radius: 22px;
      background: white;
      color: #171717;
      text-decoration: none;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 750;
      text-align: center;
      box-shadow: 0 3px 14px rgba(0,0,0,.12);
      border: 2px solid #dedede;
    }
    .app-button:active { transform: scale(.985); }
    .note {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ellie's Apps</h1>
    <p>Tap an app to open it.</p>

    <div class="apps">
      <a class="app-button" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;component=family.brighton.language/.MainActivity;package=family.brighton.language;end">
        The Ghost and Molly McGee
      </a>

      <a class="app-button" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;component=com.numbertrails.personal/.MainActivity;package=com.numbertrails.personal;end">
        Number Trails
      </a>
    </div>

    <p class="note">Fire Kids launch test</p>
  </main>
</body>
</html>
